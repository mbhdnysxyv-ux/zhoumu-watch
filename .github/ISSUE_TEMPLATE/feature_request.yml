name: 💡 提建议
description: 想要一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案。比如「我周三的课表跟别的天不一样，每次都要手动改」
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么工作
  - type: dropdown
    id: platform
    attributes:
      label: 跟哪个平台有关
      multiple: true
      options:
        - iPhone 应用
        - 桌面小组件
        - 灵动岛 / 锁屏实时活动
        - Apple Watch 应用
        - 表盘复杂功能
        - 都不是 / 通用的
